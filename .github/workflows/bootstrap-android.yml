name: Extract Smart Manager and Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SmartManagerEnterprise-GitHub-Source.zip'
      - '.github/workflows/bootstrap-android.yml'

permissions:
  contents: read

jobs:
  extract-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract project for this build (no Git push)
        shell: bash
        run: |
          set -euo pipefail
          test -f SmartManagerEnterprise-GitHub-Source.zip
          mkdir -p "$RUNNER_TEMP/smartmanager"
          unzip -q SmartManagerEnterprise-GitHub-Source.zip -d "$RUNNER_TEMP/smartmanager"
          project="$RUNNER_TEMP/smartmanager/SmartManagerEnterprise"
          test -f "$project/settings.gradle.kts"
          test -f "$project/app/build.gradle.kts"
          cp -a "$project/." .
          test -f app/src/main/java/com/smartsanaa/manager/MainActivity.kt
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartManagerEnterprise-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

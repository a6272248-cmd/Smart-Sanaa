name: Smart Manager Enterprise V4 - Updated UI APK Build

on:
  push:
    branches:
      - feature/smart-manager-enterprise-v4
    paths:
      - 'SmartManagerEnterprise-V4-FINAL*.zip'
      - '.github/workflows/build-enterprise-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enterprise-v4:
    name: Verify and build V4 (isolated branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4

      - name: Verify uploaded V4 archive and unpack sources
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA=21bc416a54726073ced24f2e438960100c54eec512128e8e677ed3a92d9cf974
          shopt -s nullglob
          archive=''
          for candidate in SmartManagerEnterprise-V4-FINAL*.zip; do
            actual=$(sha256sum "$candidate" | cut -d ' ' -f1)
            if [[ "$actual" == "$EXPECTED_SHA" ]]; then
              archive="$candidate"
              break
            fi
          done
          if [[ -z "$archive" ]]; then
            echo 'ERROR: Updated V4 ZIP not found or SHA-256 differs from the newly reviewed UI archive.' >&2
            echo 'Required SHA-256:' "$EXPECTED_SHA" >&2
            ls -la
            exit 1
          fi
          echo "Verified archive: $archive"
          echo "V4_ARCHIVE=$archive" >> "$GITHUB_ENV"
          unzip -q "$archive" -d "$GITHUB_WORKSPACE"
          test -f enterprise/settings.gradle.kts
          test -f enterprise/app/build.gradle.kts
          test -f enterprise/app/src/main/AndroidManifest.xml
          test -f enterprise/app/src/main/java/com/smartsanaa/manager/RouterOs.kt
          test -f enterprise/app/src/main/java/com/smartsanaa/manager/MainActivity.kt
          test -f enterprise/app/src/test/java/com/smartsanaa/manager/RouterWireTest.kt
          echo 'Source extracted and required project files verified.'
          echo 'RouterWireTest.kt exists; the actual test outcome will be determined by Gradle.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure installed Android SDK and install Android 36
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk" || { echo "Android SDK missing: $sdk" >&2; exit 1; }
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$manager" || { echo 'sdkmanager missing' >&2; exit 1; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$manager" --licenses > /dev/null || true
          "$manager" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          test -s "$sdk/platforms/android-36/android.jar"
          test -x "$sdk/build-tools/36.0.0/apksigner"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests (where present)
        working-directory: enterprise
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/v4-tests.log"

      - name: Run Android lint
        working-directory: enterprise
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/v4-lint.log"

      - name: Compile debug APK
        working-directory: enterprise
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/v4-build.log"

      - name: Verify APK signature, package name, and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=enterprise/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee v4-apk-signature.txt
          "$TOOLS/aapt" dump badging "$APK" | tee v4-apk-badging.txt
          grep -F "package: name='com.smartsanaa.manager'" v4-apk-badging.txt
          sha256sum "$APK" | tee v4-apk-SHA256SUMS.txt

      - name: Package extracted source with branch workflow
        shell: bash
        run: |
          set -euo pipefail
          zip -qr SmartManagerEnterprise-V4-verified-source.zip enterprise .github/workflows/build-enterprise-v4.yml \
            -x 'enterprise/.gradle/*' 'enterprise/build/*' 'enterprise/app/build/*'
          sha256sum SmartManagerEnterprise-V4-verified-source.zip > v4-source-SHA256SUMS.txt

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartManagerEnterprise-V4-debug-APK
          path: |
            enterprise/app/build/outputs/apk/debug/app-debug.apk
            v4-apk-SHA256SUMS.txt
            v4-apk-signature.txt
            v4-apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: SmartManagerEnterprise-V4-source
          path: |
            SmartManagerEnterprise-V4-verified-source.zip
            v4-source-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartManagerEnterprise-V4-diagnostics
          path: |
            v4-tests.log
            v4-lint.log
            v4-build.log
            enterprise/app/build/reports/tests/
            enterprise/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

name: Extract Smart Manager and Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'SmartManagerEnterprise-GitHub-Source.zip'
      - '.github/workflows/bootstrap-android.yml'
permissions:
  contents: write
jobs:
  extract-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f SmartManagerEnterprise-GitHub-Source.zip
          mkdir -p "$RUNNER_TEMP/smartmanager"
          unzip -q SmartManagerEnterprise-GitHub-Source.zip -d "$RUNNER_TEMP/smartmanager"
          test -f "$RUNNER_TEMP/smartmanager/SmartManagerEnterprise/app/build.gradle.kts"
          cp -a "$RUNNER_TEMP/smartmanager/SmartManagerEnterprise/." .
          test -f app/src/main/java/com/smartsanaa/manager/MainActivity.kt
      - name: Commit extracted project to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app .github/workflows/android.yml build.gradle.kts settings.gradle.kts gradle.properties gradle README.md .gitignore design BUILD_STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Extract Smart Manager Android source"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SmartManagerEnterprise-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

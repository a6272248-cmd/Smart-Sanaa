name: Smart Sanaa V5 - Native Android APK

on:
  push:
    branches:
      - feature/smart-manager-enterprise-v4
    paths:
      - Smart-Sanaa-V5-Android-Source.zip
      - .github/workflows/build-sanaa-v5.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-sanaa-v5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-v5:
    name: Verify V5 sources, test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out V5 development branch
        uses: actions/checkout@v4

      - name: Verify and extract uploaded V5 source archive
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          archive = Path('Smart-Sanaa-V5-Android-Source.zip')
          destination = Path('v5-source')
          root = 'Smart-Sanaa-V5-Android-Source/'
          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit(f'V5 ZIP not found or empty: {archive}')
          with ZipFile(archive) as z:
              broken = z.testzip()
              if broken:
                  raise SystemExit(f'Corrupt ZIP entry: {broken}')
              files = 0
              seen = set()
              for member in z.infolist():
                  path = PurePosixPath(member.filename)
                  if (not member.filename.startswith(root) or
                      path.is_absolute() or '..' in path.parts or
                      '\\' in member.filename):
                      raise SystemExit(f'Unsafe/unexpected ZIP entry: {member.filename}')
                  if member.filename in seen:
                      raise SystemExit(f'Duplicate ZIP entry: {member.filename}')
                  seen.add(member.filename)
                  mode = (member.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'Symlink ZIP entry disallowed: {member.filename}')
                  if not member.is_dir():
                      files += 1
              if files < 15:
                  raise SystemExit(f'Unexpectedly few source files: {files}')
              z.extractall(destination)
          project = destination / root
          required = [
              'settings.gradle.kts', 'build.gradle.kts',
              'app/build.gradle.kts',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/smartsanaa/manager/MainActivity.kt',
              'app/src/main/java/com/smartsanaa/manager/RouterOs.kt',
              'app/src/test/java/com/smartsanaa/manager/RouterWireTest.kt',
          ]
          for rel in required:
              if not (project / rel).is_file():
                  raise SystemExit(f'Missing required V5 source: {rel}')
          print(f'V5 source ZIP validated; {files} files extracted to {project}')
          PY
          sha256sum Smart-Sanaa-V5-Android-Source.zip | tee V5-source-SHA256SUMS.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 build requirements
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run V5 unit tests
        working-directory: v5-source/Smart-Sanaa-V5-Android-Source
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/v5-tests.log"

      - name: Run V5 lint
        working-directory: v5-source/Smart-Sanaa-V5-Android-Source
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/v5-lint.log"

      - name: Build V5 debug APK
        working-directory: v5-source/Smart-Sanaa-V5-Android-Source
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/v5-build.log"

      - name: Verify V5 APK signature, package and SHA-256
        run: |
          set -euo pipefail
          apk='v5-source/Smart-Sanaa-V5-Android-Source/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee V5-apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee V5-apk-badging.txt
          grep -F "package: name='com.smartsanaa.manager'" V5-apk-badging.txt
          sha256sum "$apk" | tee V5-APK-SHA256SUMS.txt

      - name: Upload verified V5 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Sanaa-V5-debug-APK
          path: |
            v5-source/Smart-Sanaa-V5-Android-Source/app/build/outputs/apk/debug/app-debug.apk
            V5-APK-SHA256SUMS.txt
            V5-apk-signature.txt
            V5-apk-badging.txt
            V5-source-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Sanaa-V5-build-diagnostics
          path: |
            v5-tests.log
            v5-lint.log
            v5-build.log
            v5-source/Smart-Sanaa-V5-Android-Source/app/build/reports/tests/
            v5-source/Smart-Sanaa-V5-Android-Source/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

name: Smart Sanaa V9 - Native Android APK

on:
  push:
    branches:
      - feature/smart-manager-enterprise-v4
    paths:
      - 'SmartSanaaV9-PrintScreen-Updated-Source.zip'
      - 'SmartSanaaV9.zip'
      - 'SmartSanaaV9-source.tar.gz'
      - '.github/workflows/bootstrap-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-sanaa-v9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-v9:
    name: Verify source, test, lint and build Android V9
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Validate updated ZIP and extract Android project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import stat
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          preferred = Path('SmartSanaaV9-PrintScreen-Updated-Source.zip')
          archive = preferred if preferred.is_file() else Path('SmartSanaaV9.zip')
          destination = Path('v9-source')
          if not archive.is_file() or not archive.stat().st_size:
              raise SystemExit('Android source ZIP missing or empty in this branch')
          with ZipFile(archive) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP checksum failure: {bad}')
              seen, size, count = set(), 0, 0
              for entry in z.infolist():
                  path = PurePosixPath(entry.filename)
                  mode = (entry.external_attr >> 16) & 0xFFFF
                  if (not entry.filename or entry.filename.startswith('/') or
                      '\\' in entry.filename or ':' in entry.filename or
                      any(p in ('.', '..') for p in path.parts) or
                      stat.S_ISLNK(mode)):
                      raise SystemExit(f'Unsafe ZIP entry: {entry.filename}')
                  if entry.filename in seen:
                      raise SystemExit(f'Duplicate ZIP path: {entry.filename}')
                  seen.add(entry.filename)
                  if not entry.is_dir():
                      count += 1
                      size += entry.file_size
              if count < 10 or size > 500 * 1024 * 1024:
                  raise SystemExit(f'Unexpected archive: {count} files, {size} bytes')
              destination.mkdir(exist_ok=True)
              z.extractall(destination)
          required = (
              'settings.gradle.kts',
              'build.gradle.kts',
              'app/build.gradle.kts',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/smartsanaa/manager/MainActivity.kt',
              'app/src/main/java/com/smartsanaa/manager/RouterOs.kt',
              'app/src/test/java/com/smartsanaa/manager/RouterWireTest.kt',
          )
          candidates = [destination] + [p for p in destination.iterdir() if p.is_dir()]
          projects = [p for p in candidates if all((p / f).is_file() for f in required)]
          if len(projects) != 1:
              raise SystemExit(f'Expected one Android project; found {len(projects)}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'PROJECT_DIR={projects[0].as_posix()}\n')
          print(f'Verified source {archive}: {count} files, project {projects[0]}')
          PY
          if [[ -s SmartSanaaV9-PrintScreen-Updated-Source.zip ]]; then
            sha256sum SmartSanaaV9-PrintScreen-Updated-Source.zip | tee V9-source-SHA256SUMS.txt
          else
            sha256sum SmartSanaaV9.zip | tee V9-source-SHA256SUMS.txt
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk" || { echo "Android SDK missing: $sdk" >&2; exit 1; }
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$manager" || { echo 'sdkmanager missing' >&2; exit 1; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          test -s "$sdk/platforms/android-36/android.jar"
          test -x "$sdk/build-tools/36.0.0/apksigner"
          test -x "$sdk/build-tools/36.0.0/aapt"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run V9 unit tests
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/v9-tests.log"

      - name: Run V9 Android lint
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:lintDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/v9-lint.log"

      - name: Build V9 debug APK
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/v9-build.log"

      - name: Verify APK signing, package, and checksum
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee V9-apk-signature.txt
          "$tools/aapt" dump badging "$apk" | tee V9-apk-badging.txt
          grep -F "package: name='com.smartsanaa.manager'" V9-apk-badging.txt
          sha256sum "$apk" | tee V9-APK-SHA256SUMS.txt

      - name: Upload V9 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Sanaa-V9-debug-APK
          path: |
            v9-source/**/app/build/outputs/apk/debug/app-debug.apk
            V9-APK-SHA256SUMS.txt
            V9-apk-signature.txt
            V9-apk-badging.txt
            V9-source-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Sanaa-V9-build-diagnostics
          path: |
            v9-tests.log
            v9-lint.log
            v9-build.log
            v9-source/**/app/build/reports/tests/
            v9-source/**/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

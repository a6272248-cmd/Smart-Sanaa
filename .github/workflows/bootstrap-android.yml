name: Smart Manager Enterprise 2026 - Build Fixed APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SmartManagerEnterprise-Enterprise-FIXED.zip'
      - '.github/workflows/bootstrap-android.yml'

permissions:
  contents: read

jobs:
  enterprise-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4
      - name: Extract fixed Enterprise project
        shell: bash
        run: |
          set -euo pipefail
          test -f SmartManagerEnterprise-Enterprise-FIXED.zip
          mkdir -p "$RUNNER_TEMP/smartmanager"
          unzip -q SmartManagerEnterprise-Enterprise-FIXED.zip -d "$RUNNER_TEMP/smartmanager"
          project="$RUNNER_TEMP/smartmanager/SmartManagerEnterprise"
          test -f "$project/settings.gradle.kts"
          test -f "$project/app/build.gradle.kts"
          test -f "$project/app/src/main/java/com/smartsanaa/manager/RouterOs.kt"
          cp -a "$project/." .
          echo 'Enterprise project extracted successfully'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK and install API 36
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$sdkmanager" && test -x "$sdkmanager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$sdk/platforms/android-36/android.jar"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and build Android APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/enterprise-build.log"
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartManagerEnterprise-fixed-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-build-diagnostics
          path: ${{ runner.temp }}/enterprise-build.log
          if-no-files-found: ignore

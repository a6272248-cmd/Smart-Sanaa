name: Smart Sanaa - Automatic Native Android APK

on:
  push:
    branches:
      - feature/smart-manager-enterprise-v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-sanaa-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Validate latest source, test, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out selected branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed source and securely extract Android project
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import shutil
          import stat
          import subprocess
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          required = (
              'settings.gradle.kts',
              'build.gradle.kts',
              'app/build.gradle.kts',
              'app/src/main/AndroidManifest.xml',
          )
          output = Path('extracted-android-source')

          def run_git(*args):
              return subprocess.run(['git', *args], check=True, capture_output=True, text=True).stdout.strip()

          def is_candidate(path):
              return path.is_file() and path.parent == Path('.') and bool(
                  re.fullmatch(r'SmartSanaa.*\.(?:zip|tar\.gz|tgz)', path.name, flags=re.I)
              )

          archives = [p for p in Path('.').iterdir() if is_candidate(p)]
          before = os.environ.get('BEFORE_SHA', '')
          current = os.environ['CURRENT_SHA']
          changed = []
          if re.fullmatch(r'[0-9a-f]{40}', before) and before != '0' * 40:
              check = subprocess.run(['git', 'cat-file', '-e', before + '^{commit}'], capture_output=True)
              if check.returncode == 0:
                  changed = run_git('diff', '--name-only', before, current).splitlines()
          changed_archives = [p for p in archives if p.name in changed]
          if len(changed_archives) > 1:
              raise SystemExit('Multiple SmartSanaa source archives changed together. Upload only one current source archive per commit.')

          # On workflow_dispatch, use the most recently committed matching archive.
          # Do not accidentally build an older archive when newer native sources were changed.
          if changed_archives:
              archive = changed_archives[0]
          elif archives:
              archive = max(archives, key=lambda p: (
                  int(run_git('log', '-1', '--format=%ct', '--', p.name) or '0'), p.name
              ))
          else:
              archive = None

          if archive is not None:
              print('Selected source archive:', archive, flush=True)
              if archive.stat().st_size == 0:
                  raise SystemExit('Selected source archive is empty')
              entries = []
              zip_kind = archive.name.lower().endswith('.zip')
              if zip_kind:
                  with zipfile.ZipFile(archive) as z:
                      bad = z.testzip()
                      if bad:
                          raise SystemExit('ZIP CRC error: ' + bad)
                      for m in z.infolist():
                          mode = (m.external_attr >> 16) & 0xffff
                          unsafe_type = stat.S_ISLNK(mode) or (mode != 0 and not (stat.S_ISREG(mode) or stat.S_ISDIR(mode)))
                          entries.append((m.filename, m.file_size, m.is_dir(), unsafe_type))
              else:
                  with tarfile.open(archive, 'r:gz') as z:
                      for m in z.getmembers():
                          entries.append((m.name, m.size, m.isdir(), not (m.isfile() or m.isdir())))

              seen = set()
              for name, size, is_dir, unsafe in entries:
                  path = PurePosixPath(name)
                  canonical = str(path)
                  if (unsafe or not name or name.startswith('/') or '\\' in name or ':' in name or
                      '..' in path.parts or canonical in seen):
                      raise SystemExit('Unsafe or duplicate archive entry: ' + name)
                  seen.add(canonical)
              if len(entries) < 10 or sum(size for _, size, is_dir, _ in entries if not is_dir) > 500 * 1024 * 1024:
                  raise SystemExit('Invalid source archive size or content')

              output.mkdir(exist_ok=True)
              if zip_kind:
                  with zipfile.ZipFile(archive) as z:
                      z.extractall(output)
              else:
                  with tarfile.open(archive, 'r:gz') as z:
                      for m in z.getmembers():
                          dest = output.joinpath(*PurePosixPath(m.name).parts)
                          if m.isdir():
                              dest.mkdir(parents=True, exist_ok=True)
                          else:
                              dest.parent.mkdir(parents=True, exist_ok=True)
                              with z.extractfile(m) as source, dest.open('wb') as target:
                                  shutil.copyfileobj(source, target)
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              Path('source-SHA256SUMS.txt').write_text(digest + '  ' + archive.name + '\n')
              print('Archive SHA-256:', digest)
              root = output
          else:
              print('No SmartSanaa archive. Looking for checked-in Gradle project.')
              root = Path('.')

          candidates = [root] + [p.parent for p in root.rglob('settings.gradle.kts')]
          projects = list(dict.fromkeys(p for p in candidates if all((p / f).is_file() for f in required)))
          if len(projects) != 1:
              raise SystemExit('Expected one complete native Android Gradle project; found ' + str(len(projects)))
          project = projects[0]
          print('Android project:', project)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('PROJECT_DIR=' + project.as_posix() + '\n')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$manager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          test -s "$sdk/platforms/android-36/android.jar"
          test -x "$sdk/build-tools/36.0.0/apksigner"
          test -x "$sdk/build-tools/36.0.0/aapt"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-tests.log"

      - name: Run lint
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:lintDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-lint.log"

      - name: Build debug APK
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Verify APK signature, package and checksum
        run: |
          set -euo pipefail
          mkdir -p verified-apk
          apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee verified-apk/signature.txt
          "$tools/aapt" dump badging "$apk" | tee verified-apk/badging.txt
          grep -F "package: name='com.smartsanaa.manager'" verified-apk/badging.txt
          cp "$apk" verified-apk/Smart-Sanaa-debug.apk
          (cd verified-apk && sha256sum Smart-Sanaa-debug.apk > SHA256SUMS.txt)
          cp source-SHA256SUMS.txt verified-apk/source-SHA256SUMS.txt 2>/dev/null || true

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Sanaa-Android-debug-APK
          path: verified-apk/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Sanaa-Android-build-diagnostics
          path: |
            android-tests.log
            android-lint.log
            android-build.log
            extracted-android-source/**/app/build/reports/tests/
            extracted-android-source/**/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
